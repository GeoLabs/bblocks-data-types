                "type": "RegisterAction",
                "actionType": "addition",
                "proposer": "https://geolabs.github.io/bblocks-data-types/def/geolabs",
                "startedAtTime": "2026-11-01T00:00:00Z"
              }
            },
            "validityStatus": "invalid",
            "publicationStatus": "unpublished",
            "isReplacedBy": "https://w3id.org/geolabs-ospd/data-formats/format/stac-item-collection"
          }
      - language: turtle
        ref: ontology.ttl
