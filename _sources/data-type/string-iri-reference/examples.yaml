examples:
  - title: IRI reference string
    content: >-
      The register item of the IRI reference string data type: it realizes the governed version of the
      concept and belongs to the register's data type item class. The type is withdrawn:
      item and version are unpublished, and the item is replaced by a format of the
      data-formats register.
    snippets:
      - language: json
        code: |
          {
            "id": "https://geolabs.github.io/bblocks-data-types/def/data-type/string-iri-reference/item",
            "type": "DataTypeItem",
            "objectIdentifier": "https://geolabs.github.io/bblocks-data-types/def/data-type/string-iri-reference/item",
            "itemClass": "https://geolabs.github.io/bblocks-data-types/def/dataTypeItemClass",
            "inRegister": "https://geolabs.github.io/bblocks-data-types/def/register",
            "realizes": {
              "id": "https://geolabs.github.io/bblocks-data-types/def/data-type/string-iri-reference/v1",
              "type": "DataTypeVersion",
              "versionOf": {
                "id": "https://geolabs.github.io/bblocks-data-types/def/data-type/string-iri-reference",
                "type": "Concept",
                "prefLabel": "IRI reference string",
                "definition": "A string representing an IRI reference as defined by RFC 3987.",
                "inScheme": "https://geolabs.github.io/bblocks-data-types/def/data-types"
