examples:
  - title: The data type item class (JSON)
    content: >-
      The abstraction every data type item shares. `validatedBy` names the executable rule set
      (the SHACL shape of the vocabulary) that expresses its data requirements.
    snippets:
      - language: json
        code: |
          {
            "id": "https://w3id.org/geolabs/ospd/data-types/dataTypeItemClass",
            "type": "RegisterItemClass",
            "title": "Data type",
            "definedIn": "https://w3id.org/geolabs/ospd/data-types/register",
            "validatedBy": "https://w3id.org/geolabs/ospd/data-types/DataTypeItemShape"
          }
